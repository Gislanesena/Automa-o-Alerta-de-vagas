name: Executar Alerta de Vagas

# Configura quando o GitHub vai rodar o código
on:
  schedule:
    # Roda todo dia às 12:00 UTC (09:00 no horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch: # Adiciona um botão no site do GitHub para rodar manualmente sempre que quiser

jobs:
  rodar-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      # 2. Configura o Python no computador do GitHub
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Instala as bibliotecas do requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # 4. Executa o script injetando a variável secreta do Discord
      - name: Rodar script Python
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
